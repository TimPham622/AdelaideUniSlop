services:
  - type: web
    name: adelaide-uni-slop-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEMANTIC_SEARCH
        value: "1"
      - key: EMBEDDING_CACHE
        value: /models
