services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: slop
      POSTGRES_USER: slop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slop}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slop"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://slop:${POSTGRES_PASSWORD:-slop}@db:5432/slop
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      EMBEDDING_CACHE: /models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && slop load-fixtures && slop embed && uvicorn slop.main:app --host 0.0.0.0 --no-access-log"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      start_period: 180s
      retries: 10
  web:
    build:
      context: apps/web
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres:
