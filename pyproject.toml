[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adelaide-uni-slop"
version = "0.1.0"
description = "Source-backed Adelaide University degree planning"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "lark>=1.2,<2",
  "pydantic-settings>=2.7,<3", "ortools>=9.12,<10", "fastembed>=0.6,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[project.scripts]
slop = "slop.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["backend/slop"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
